server:
  port: 8080

spring:
  application:
    name: filinglens

app:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    chat-model: ${OLLAMA_CHAT_MODEL:llama3.2:1b}
    embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    timeout-seconds: 120
  qdrant:
    url: ${QDRANT_URL:http://localhost:6333}
    collection: ${QDRANT_COLLECTION:sec_10k_sections}
    dimension: ${QDRANT_VECTOR_DIMENSION:768}
  data:
    dir: ${DATA_DIR:../data}
    auto-ingest: ${AUTO_INGEST:false}
  rag:
    default-top-k: 5
    max-context-chunks: 6
    chunk-size-tokens: 800
    chunk-overlap-tokens: 120
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  debug:
    log-llm-prompts: ${LOG_LLM_PROMPTS:false}
  request-tracing:
    header-name: ${CORRELATION_ID_HEADER:X-Correlation-Id}
    include-response-header: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  file:
    path: ${LOG_PATH:logs}
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    com.sec.rag: INFO
    org.springframework.web.filter.CommonsRequestLoggingFilter: WARN
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{correlationId:-na}] %logger{36} - %msg%n"
